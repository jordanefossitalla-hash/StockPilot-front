name: Frontend CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect available npm scripts
        id: scripts
        shell: bash
        run: |
          echo "has_lint=$(node -p \"Boolean(require('./package.json').scripts?.lint)\")" >> "$GITHUB_OUTPUT"
          echo "has_test=$(node -p \"Boolean(require('./package.json').scripts?.test)\")" >> "$GITHUB_OUTPUT"

      - name: Run lint
        if: steps.scripts.outputs.has_lint == 'true'
        run: npm run lint

      - name: Run tests
        if: steps.scripts.outputs.has_test == 'true'
        run: npm test -- --runInBand

      - name: Build application
        run: npm run build

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          if-no-files-found: error
