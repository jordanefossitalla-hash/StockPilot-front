services:
  frontend:
    container_name: ${DOCKER_CONTAINER_NAME:-stockpilot-front}
    image: ${DOCKER_IMAGE_NAME:-stockpilot-front:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped
